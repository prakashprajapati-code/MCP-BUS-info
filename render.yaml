services:
  - type: web
    name: gsrtc-mcp
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: GSRTC_MODE
        value: direct
      - key: GSRTC_TIMEOUT_SEC
        value: 30
      - key: GSRTC_TZ
        value: Asia/Kolkata
      - key: GSRTC_USER_AGENT
        value: okhttp/3.4.2
      # Set these in the Render dashboard. Values are deliberately not stored here.
      - key: GSRTC_BASE_URL
        sync: false
      - key: GSRTC_ANDROID_ID
        sync: false
      # Set this in the Render dashboard to require a token.
      # Leave it unset for an open endpoint.
      - key: MCP_AUTH_TOKEN
        sync: false
